<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Coin Race, a small real-time multiplayer game" />
		<title>Coin Race</title>
		<link rel="stylesheet" href="./style.css" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	</head>
	<body>
		<main class="layout">
			<div class="stage">
				<canvas id="game-window" width="640" height="480"></canvas>
				<section id="map-vote" class="map-vote" aria-label="Map vote" hidden>
					<p class="map-vote-title"></p>
					<div class="map-vote-cards"></div>
				</section>
				<form id="join-panel" class="join-panel" autocomplete="off" hidden>
					<h2>Join the race</h2>
					<label id="join-name-label" class="visually-hidden" for="join-name">Name</label>
					<input id="join-name" name="name" maxlength="12" />
					<div class="swatches" role="group" aria-label="Colour"></div>
					<p class="join-error" role="alert"></p>
					<button type="submit">Join game</button>
					<div class="theme-picker">
						<label for="join-theme">Theme</label>
						<select id="join-theme" class="theme-select"></select>
						<button type="button" class="sound-toggle" aria-pressed="true">Sound: on</button>
					</div>
					<p id="join-hint" class="hint"></p>
				</form>
			</div>
			<aside class="scoreboard">
				<h2>Scoreboard</h2>
				<ol id="scoreboard"></ol>
				<section class="best-runs" aria-label="Best runs">
					<h2>Best runs</h2>
					<div class="segmented" role="group" aria-label="Period">
						<button type="button" data-period="today">Today</button>
						<button type="button" data-period="month">Month</button>
						<button type="button" data-period="all">All time</button>
					</div>
					<div class="segmented" role="group" aria-label="Showing">
						<button type="button" data-scope="everyone">Everyone</button>
						<button type="button" data-scope="mine">Mine</button>
					</div>
					<p class="best-runs-rank"></p>
					<ol class="best-runs-list"></ol>
				</section>
				<div class="theme-picker">
					<label for="side-theme">Theme</label>
					<select id="side-theme" class="theme-select"></select>
					<button type="button" class="sound-toggle" aria-pressed="true">Sound: on</button>
				</div>
			</aside>
		</main>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
