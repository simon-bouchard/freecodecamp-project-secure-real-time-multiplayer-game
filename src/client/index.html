<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Coin Race, a small real-time multiplayer game" />
		<title>Coin Race</title>
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body class="theme-ninja">
		<main class="layout">
			<div class="stage">
				<canvas id="game-window" width="640" height="480"></canvas>
				<form id="join-panel" class="join-panel" autocomplete="off" hidden>
					<h2>Join the race</h2>
					<label for="join-name">Ninja name</label>
					<input id="join-name" name="name" maxlength="12" />
					<span class="label">Colour</span>
					<div class="swatches" role="group" aria-label="Colour"></div>
					<p class="join-error" role="alert"></p>
					<button type="submit">Join game</button>
					<p class="hint">WASD or arrow keys. Grab the narutomaki!</p>
				</form>
			</div>
			<aside class="scoreboard">
				<h2>Scoreboard</h2>
				<ol id="scoreboard"></ol>
			</aside>
		</main>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
